<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poise: the daily balancing game</title>
<meta name="description" content="Five shapes a day. Place the pin where each one balances.">
<meta http-equiv="refresh" content="0;url=https://poisedaily.com/">
<script>
(function () {
  var url = "https://poisedaily.com/";
  try { window.top.location.replace(url); } catch (e) {}
  location.replace(url);
})();
</script>
<style>
  :root { color-scheme: light dark; --bg: #eceef2; --ink: #171a21; --line: #cdd2db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --ink: #f1f3f7; --line: #323743; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 600 16px/1.4 system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 2.4rem; letter-spacing: -0.04em; margin: 0 0 8px; }
  p { margin: 0 0 24px; opacity: 0.72; }
  a {
    display: inline-block;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    font-weight: 800;
    padding: 14px 22px;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <main>
    <h1>Poise</h1>
    <p>Pin each shape at its balance point.</p>
    <a href="https://poisedaily.com/" target="_top" rel="noopener">Play today’s game</a>
  </main>
</body>
</html>
